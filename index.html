<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seymur's J.A.R.V.I.S.</title>
    <style>
        :root {
            --c-bg: #030712;
            --c-pri: #00f0ff;
            --c-mid: #005f73;
            --c-text: #e0fbfc;
            --c-green: #06d6a0;
            --c-blue: #3a86ff;
            --c-gold: #ffd166;
            --c-red: #ef476f;
        }

        body {
            background-color: var(--c-bg);
            color: var(--c-text);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 94vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--c-mid);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .header h2 {
            margin: 0;
            color: var(--c-pri);
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .header .status-sub {
            font-size: 11px;
            color: var(--c-mid);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ARC REACTOR BUTTON */
        .arc-reactor {
            width: 180px;
            height: 180px;
            border: 2px dashed var(--c-pri);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 15s linear infinite;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            margin: 15px 0;
            cursor: pointer;
            background: rgba(0, 240, 255, 0.03);
        }

        .arc-reactor::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            border: 1px solid var(--c-mid);
            border-radius: 50%;
            animation: spin-reverse 10s linear infinite;
        }

        .inner-core {
            width: 90px;
            height: 90px;
            border: 2px solid var(--c-pri);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .core-dot {
            width: 60px;
            height: 60px;
            background-color: var(--c-pri);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--c-pri);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--c-bg);
            font-weight: bold;
            font-size: 11px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .core-dot.listening { background-color: var(--c-green); box-shadow: 0 0 30px var(--c-green); }
        .core-dot.speaking { background-color: var(--c-blue); box-shadow: 0 0 30px var(--c-blue); }
        .core-dot.thinking { background-color: var(--c-gold); box-shadow: 0 0 30px var(--c-gold); }
        .core-dot.error { background-color: var(--c-red); box-shadow: 0 0 30px var(--c-red); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        .chat-box {
            width: 100%;
            height: 120px;
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid var(--c-mid);
            border-radius: 6px;
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .chat-box div {
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        input {
            flex: 1;
            background: #020617;
            border: 1px solid var(--c-mid);
            color: var(--c-text);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
        }

        input:focus {
            border-color: var(--c-pri);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        button {
            background: var(--c-mid);
            color: var(--c-text);
            border: 1px solid var(--c-pri);
            padding: 10px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        button:active {
            background: var(--c-pri);
            color: var(--c-bg);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Seymur's J.A.R.V.I.S.</h2>
        <div class="status-sub" id="status-text">SİSTEM AKTİF // BEKLENİYOR</div>
    </div>

    <div class="main-container">
        <!-- Reaktor (Tıklayınca Dinlemeye Başlar) -->
        <div class="arc-reactor" onclick="toggleMic()">
            <div class="inner-core">
                <div class="core-dot" id="core-dot">DİNLE</div>
            </div>
        </div>

        <div class="chat-box" id="chat-box">
            <div><span style="color:var(--c-gold)">[SYS]</span> J.A.R.V.I.S Bulut Bağlantısı Sağlandı. Hazır...</div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="cmd-input" placeholder="Komut yazın..." onkeypress="checkEnter(event)">
        <button onclick="sendCmd()">GÖNDER</button>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const cmdInput = document.getElementById("cmd-input");
        const coreDot = document.getElementById("core-dot");
        const statusText = document.getElementById("status-text");

        function appendLog(sender, text, type="pri") {
            const div = document.createElement("div");
            let col = "var(--c-text)";
            if(type === "sys") col = "var(--c-gold)";
            if(type === "you") col = "#00f0ff";
            if(type === "err") col = "var(--c-red)";
            
            div.innerHTML = `<strong style="color:${col}">[${new Date().toLocaleTimeString()}] ${sender}:</strong> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setCoreState(state) {
            coreDot.className = "core-dot " + state.toLowerCase();
            if(state === "LISTENING") coreDot.innerText = "DİNLİYOR";
            else if(state === "THINKING") coreDot.innerText = "DÜŞÜNÜYOR";
            else if(state === "SPEAKING") coreDot.innerText = "KONUŞUYOR";
            else if(state === "ERROR") coreDot.innerText = "HATA";
            else coreDot.innerText = "DİNLE";
            
            statusText.innerText = "SİSTEM // " + state;
        }

        function sendCmd() {
            const text = cmdInput.value.trim();
            if(!text) return;
            appendLog("Siz", text, "you");
            cmdInput.value = "";

            setCoreState("THINKING");

            fetch('/api/command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: text})
            })
            .then(res => res.json())
            .then(data => {
                setCoreState("SPEAKING");
                if(data.status === "success") {
                    appendLog("JARVIS", data.response, "pri");
                    speak(data.response);
                } else {
                    appendLog("ERR", data.message, "err");
                    setCoreState("ERROR");
                }
            })
            .catch(err => {
                appendLog("ERR", "Bağlantı hatası!", "err");
                setCoreState("ERROR");
            });
        }

        function checkEnter(e) {
            if(e.key === 'Enter') sendCmd();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                utterance.onend = () => setCoreState("ONLINE");
                window.speechSynthesis.speak(utterance);
            } else {
                setCoreState("ONLINE");
            }
        }

        let recognition;
        let isListening = false;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = false;

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                cmdInput.value = speechToText;
                isListening = false;
                setCoreState("ONLINE");
                sendCmd();
            };

            recognition.onerror = function() {
                isListening = false;
                setCoreState("ONLINE");
            };

            recognition.onend = function() {
                isListening = false;
                if(statusText.innerText.includes("LISTENING")) setCoreState("ONLINE");
            };
        }

        function toggleMic() {
            if (!recognition) {
                alert("Tarayıcınız ses tanımayı desteklemiyor.");
                return;
            }
            if (isListening) {
                recognition.stop();
                isListening = false;
                setCoreState("ONLINE");
            } else {
                recognition.start();
                isListening = true;
                setCoreState("LISTENING");
            }
        }
    </script>
</body>
</html>
